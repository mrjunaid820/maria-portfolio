<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rect with deep navy cyber tint -->
  <rect width="64" height="64" rx="16" fill="#050B1A"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#mmGrad)" stroke-width="2" opacity="0.8"/>
  <!-- Stylized M lettermark -->
  <path d="M16 44 L16 20 L24 34 L32 20 L40 34 L48 20 L48 44" 
        fill="none" 
        stroke="url(#mmGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
